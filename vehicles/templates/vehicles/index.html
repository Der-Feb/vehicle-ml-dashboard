<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicle ML Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f6f9; }
        .dashboard-content { min-height: 80vh; }
        .nav-pills .nav-link.active { background-color: #0d6efd; }
    </style>
</head>
<body>
    <div class="container-fluid py-4">
        <div class="row g-4">
            <aside class="col-md-3 col-lg-2">
                <div class="list-group position-sticky" style="top: 1rem">
                    <a class="list-group-item list-group-item-action active" href="#frequency-table">
                        Frequency Tables
                    </a>
                </div>
            </aside>
            <main class="col-md-9 col-lg-10 dashboard-content">
                <h1 class="text-center text-primary mb-2">Vehicle Machine Learning Dashboard</h1>
                <p class="text-center text-muted mb-4">Analysis of {{ vehicle_count }} vehicles</p>
                <section id="frequency-table" class="card shadow-sm">
                    <div class="card-header bg-info text-white">Manufacturer Frequency Table</div>
                    <div class="card-body">{{ frequency_table|safe }}</div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
